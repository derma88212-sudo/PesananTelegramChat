# =============================================================================
# docker-compose for Telegram Digital Goods Store & Admin Panel
# Includes the app + an optional Redis cache service.
# Usage:  docker compose up -d --build
# =============================================================================
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-store-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Point the app at the bundled Redis service (override in .env if external)
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: telegram-store-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  redis-data:
